name: SuperAlarm
options:
  bundleIdPrefix: com.superalarm
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: SuperAlarm/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.superalarm.app
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: false
    ENABLE_PREVIEWS: true

targets:
  SuperAlarm:
    type: application
    platform: iOS
    sources:
      - path: SuperAlarm
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_NAME: SuperAlarm
        INFOPLIST_FILE: SuperAlarm/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
    entitlements:
      path: SuperAlarm/SuperAlarm.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: SuperAlarm/Info.plist
